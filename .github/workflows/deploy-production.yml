name: Validate and deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview FTP changes without uploading or deleting files
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test deployment payload filtering
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check js/custom.js
      - name: Prepare public website payload
        run: python3 scripts/prepare_deploy.py

  ftp-preflight:
    name: Check production FTP access (read-only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.FTP_PREFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify encrypted login and production directory without writing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: python3 scripts/check_ftp.py

  deploy:
    name: Deploy to production over FTP/FTPS
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-ftp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate hosting configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import PurePosixPath
          required = ['FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD', 'FTP_SERVER_DIR']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure GitHub Actions secrets before deploying: ' + ', '.join(missing))
          folder = os.environ['FTP_SERVER_DIR']
          if not folder.endswith('/') or '..' in PurePosixPath(folder).parts or '\n' in folder or '\r' in folder:
              raise SystemExit('FTP_SERVER_DIR must be the confirmed production directory, ending in /, without parent traversal.')
          if os.environ['FTP_PROTOCOL'] not in {'ftp', 'ftps', 'ftps-legacy'}:
              raise SystemExit('FTP_PROTOCOL must be ftp, ftps or ftps-legacy. SFTP requires a different deployment implementation.')
          port = os.environ['FTP_PORT']
          if not port.isdecimal() or not 1 <= int(port) <= 65535:
              raise SystemExit('FTP_PORT must be a valid port number.')
          PY
      - name: Prepare public website payload
        run: python3 scripts/prepare_deploy.py
      - name: Sync website
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./.deploy/
          state-name: .rensch-website-deploy-state.json
          dangerous-clean-slate: false
          security: strict
          log-level: minimal
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
